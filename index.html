@utility bg-flow {
  background: linear-gradient(135deg, var(--cream) 0%, var(--blush) 50%, oklch(0.99 0.01 60) 100%);
}
@utility card-paper {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 1.75rem;
  box-shadow: 0 12px 28px -10px color-mix(in oklab, var(--rose) 30%, transparent);
  transform: translateZ(0);
}

  background-color: #f6f8fa;
  background-image: repeating-linear-gradient(

    transparent 0px,
    transparent 31px,
    #cbd5e1 31px,
    #cbd5e1 32px

  background-attachment: local;
  color: #1e293b;
  font-family: var(--font-hand);
  line-height: 32px;
  border: 1px solid #cbd5e1;
  border-radius: 1rem;

}

  padding: 0.75rem 0.75rem 1rem;
  border-radius: 0.5rem;
  box-shadow: 0 12px 24px -8px color-mix(in oklab, var(--rose-deep) 30%, transparent);
  will-change: transform, opacity;
  transform: translateZ(0);
}
@utility btn-primary {
  border-radius: 9999px;
  padding: 0.8rem 1.8rem;
  font-weight: 600;
  color: var(--cream);
  background: linear-gradient(135deg, var(--rose), var(--rose-deep));
  box-shadow: 0 8px 18px -6px var(--rose);
  transition: transform .2s ease;
  will-change: transform;
  &:hover { transform: translate3d(0, -2px, 0); }
}
@utility btn-soft {
  border-radius: 9999px;
  padding: 0.8rem 1.4rem;
  font-weight: 600;
  color: var(--rose-deep);
  background: var(--card);
  border: 2px solid var(--blush);
  will-change: transform;
}
@utility chip {
  border-radius: 9999px;
  padding: 0.35rem 0.95rem;
  font-size: 0.82rem;
  font-weight: 600;
  border: 1px solid var(--blush);
  background: var(--cream);
  color: var(--rose-deep);
  font-family: var(--font-body);
  line-height: 1.4;
}
@utility chip-active {
  background: var(--rose);
  color: var(--cream);
}
@utility caret { animation: blink 1s steps(1) infinite; color: var(--rose); }
@utility animate-spin-slow { animation: spin 16s linear infinite; will-change: transform; }
@utility float-heart { bottom: -40px; opacity: .5; animation: rise linear infinite; will-change: transform, opacity; }
@utility float-deco { animation: bob ease-in-out infinite; will-change: transform; }
@utility envelope-wobble { animation: envPulse 2.2s ease-in-out infinite; will-change: transform; }
@utility balloon-rise { bottom: -140px; animation: balloonUp linear infinite; will-change: transform; }
@utility love-rain { bottom: -50px; animation: loveUp linear infinite; will-change: transform, opacity; }
@utility letter-mask {
  mask-image: linear-gradient(to bottom, transparent 0%, black 4%, black 96%, transparent 100%);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  will-change: scroll-position;
  transform: translateZ(0);
}
@keyframes blink { 50% { opacity: 0; } }
@keyframes rise {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: .5; }
  100% { transform: translate3d(0, -110vh, 0) rotate(35deg); opacity: 0; }
}
@keyframes loveUp {
  0% { transform: translate3d(0, 0, 0) scale(0.7) rotate(-10deg); opacity: 0.95; }
  70% { opacity: 0.85; }
  100% { transform: translate3d(0, -115vh, 0) scale(1.15) rotate(25deg); opacity: 0; }
}
@keyframes bob {
  0%, 100% { transform: translate3d(0, 0, 0) rotate(-6deg); }
  50% { transform: translate3d(0, -14px, 0) rotate(6deg); }
}
@keyframes envPulse {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(-2deg); }
  50% { transform: translate3d(0, -10px, 0) scale(1.05) rotate(2deg); }
}
@keyframes balloonUp {
  0% { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(0, -125vh, 0); }
}
